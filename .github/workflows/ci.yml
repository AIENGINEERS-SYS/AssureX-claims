name: AssureX CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSUREX_ENV: development
      DATABASE_URL: sqlite:////tmp/assurex-ci.sqlite3
      JWT_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-123456789
      OCR_PROVIDER: disabled
      RATELIMIT_STORAGE_URI: memory://
      FRONTEND_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q backend tests
      - name: Apply migrations
        run: python -m flask --app backend:create_app db upgrade
      - name: Run security, notification and migration tests
        run: pytest -q tests/test_rate_limiting.py tests/test_notifications.py tests/test_dashboard_migrations.py tests/test_auth_migrations.py tests/test_migration_heads.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
